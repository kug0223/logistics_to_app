name: ALfit
description: "나에게 딱 맞는 알바 매칭 플랫폼"
publish_to: 'none'

version: 1.0.8+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
 
  flutter_localizations:
    sdk: flutter
 
  # Firebase 핵심
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  cloud_functions: ^5.1.5
  firebase_storage: ^12.3.6
  firebase_messaging: ^15.1.5
  firebase_crashlytics: ^4.1.3
  firebase_app_check: ^0.3.2+2
  firebase_remote_config: ^5.4.0
  firebase_analytics: ^11.3.6
  
  # 푸시 알림 (포그라운드 표시용)
  flutter_local_notifications: ^18.0.1
  
  # 상태 관리
  provider: ^6.1.2
  
  # UI/UX
  cupertino_icons: ^1.0.8
  loading_animation_widget: ^1.2.1
  flutter_svg: ^2.0.10+1
  
  # 위치/GPS
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # 비콘 (BLE iBeacon/Eddystone 스캔)
  flutter_blue_plus: ^1.35.5
  
  # 네트워크 상태 감지
  connectivity_plus: ^6.1.1

  # 유틸리티
  package_info_plus: ^8.0.0
  intl: ^0.20.2
  http: ^1.2.2
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2  # 🆕 온보딩 상태 저장용
  
  # WebView (주소 검색용)
  webview_flutter: ^4.4.2

  # 포트원(PortOne) 본인인증 SDK
  iamport_flutter: ^0.10.21

  # 캘린더
  table_calendar: ^3.1.2

  # URL 런처 (전화걸기, 지도 등)
  url_launcher: ^6.3.1
  
  # 이미지 선택 (회원가입 서류 업로드용)
  image_picker: ^1.0.7
  
  # 이미지 압축
  flutter_image_compress: ^2.1.0
  
  # 이미지 캐싱
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  # 암호화 (주민번호·계좌번호 AES 암호화)
  encrypt: ^5.0.3
  pointycastle: ^3.7.3
  crypto: ^3.0.6

  # OCR (텍스트 인식 - 신분증/서류 검증용)
  google_mlkit_text_recognition: ^0.15.0

  # PDF 생성 및 인쇄
  pdf: ^3.10.8
  printing: ^5.12.0

  # 파일 공유
  share_plus: ^10.1.4

  # Excel 생성 (명단 내보내기)
  excel: ^4.0.6

  # 차트 (통계 화면)
  fl_chart: ^0.69.0

  # 손글씨 서명 (근로계약서)
  signature: ^5.5.0

  # 네이티브 스플래시 — preserve()/remove() 런타임 API 사용을 위해 dev 아닌 runtime dependency
  flutter_native_splash: ^2.4.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#1565C0"
  image: assets/icons/app_icon_foreground.png
  color_dark: "#1565C0"
  image_dark: assets/icons/app_icon_foreground.png
  android: true
  ios: true
  android_12:
    image: assets/icons/app_icon_foreground.png
    icon_background_color: "#1565C0"

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/fonts/
  
  # ✅ PDF용 한글 폰트 (Noto Sans KR)
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.ttf
        - asset: assets/fonts/NotoSansKR-Bold.ttf
          weight: 700