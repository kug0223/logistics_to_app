name: ALfit
description: "나에게 딱 맞는 알바 매칭 플랫폼"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
 
  flutter_localizations:
    sdk: flutter
 
  # Firebase 핵심
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_messaging: ^15.1.5
  
  # 상태 관리
  provider: ^6.1.2
  
  # UI/UX
  cupertino_icons: ^1.0.8
  fluttertoast: ^8.2.8
  loading_animation_widget: ^1.2.1
  flutter_svg: ^2.0.10+1
  
  # 위치/GPS
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  
  # 유틸리티
  intl: ^0.20.2
  http: ^1.2.2
  
  # WebView (주소 검색용)
  webview_flutter: ^4.4.2
  
  # 캘린더
  table_calendar: ^3.1.2

  # URL 런처 (전화걸기, 지도 등)
  url_launcher: ^6.3.1
  
  # 이미지 선택 (회원가입 서류 업로드용)
  image_picker: ^1.0.7
  
  # OCR (텍스트 인식 - 신분증/서류 검증용)
  google_mlkit_text_recognition: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true