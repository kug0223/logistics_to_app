name: ALfit
description: "나에게 딱 맞는 알바 매칭 플랫폼"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
 
  flutter_localizations:
    sdk: flutter
 
  # Firebase 핵심
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  firebase_messaging: ^15.1.5
  
  # 푸시 알림 (포그라운드 표시용)
  flutter_local_notifications: ^18.0.1
  
  # 상태 관리
  provider: ^6.1.2
  
  # UI/UX
  cupertino_icons: ^1.0.8
  fluttertoast: ^8.2.8
  loading_animation_widget: ^1.2.1
  flutter_svg: ^2.0.10+1
  
  # 위치/GPS
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  
  # 유틸리티
  intl: ^0.20.2
  http: ^1.2.2
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2  # 🆕 온보딩 상태 저장용
  
  # WebView (주소 검색용)
  webview_flutter: ^4.4.2
  
  # 캘린더
  table_calendar: ^3.1.2

  # URL 런처 (전화걸기, 지도 등)
  url_launcher: ^6.3.1
  
  # 이미지 선택 (회원가입 서류 업로드용)
  image_picker: ^1.0.7
  
  # 이미지 압축
  flutter_image_compress: ^2.1.0
  
  # 이미지 캐싱
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  # OCR (텍스트 인식 - 신분증/서류 검증용)
  google_mlkit_text_recognition: ^0.15.0

  # PDF 생성 및 인쇄
  pdf: ^3.10.8
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#1976D2"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/fonts/
  
  # ✅ PDF용 한글 폰트 (Noto Sans KR)
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.ttf
        - asset: assets/fonts/NotoSansKR-Bold.ttf
          weight: 700